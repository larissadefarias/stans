# Versão web do app Stans no Netlify. Passo a passo em DEPLOY.md.
# Em Site configuration > Environment variables, crie EXPO_PUBLIC_API_URL com o endereço da API no Render.
[build]
  base = "mobile-app"
  command = "npm ci --legacy-peer-deps && npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# App de página única: qualquer rota (/feed, /c/123...) abre o index.html e o Expo Router resolve
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
